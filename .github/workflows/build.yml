cat <<EOF > ~/Anya-Project/.github/workflows/build.yml
name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer
        uses: ArtemGrubyak/buildozer-action@v1.6.1
        with:
          buildozer_version: master
          python_version: 3.11

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anya-apk
          path: bin/*.apk
EOF

